services:
  - type: worker
    name: texthaps-agent
    runtime: node
    plan: standard
    # The embedding model is downloaded at build time, so it ships with the deploy.
    buildCommand: npm ci && npm run warm-model
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PROJECT_ID
        sync: false
      - key: PROJECT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      # Jev checks a rec's Exa result is its own site before it's sent as a card.
      - key: JEV_API_KEY
        sync: false
      - key: MONID_API_KEY
        sync: false
      # Gemini watches Instagram reels (video and audio) to save the spots in them.
      - key: GEMINI_API_KEY
        sync: false
